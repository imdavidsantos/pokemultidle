name: CI

# Roda a cada pull request e a cada push na branch principal: lint + build.
# O build é o mesmo do instalador (vite build), então um erro de importação ou de sintaxe aparece aqui, não na release.
on:
  pull_request:
  push:
    branches: [main, master]

# Um push novo cancela a verificação anterior da mesma branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # só o vite build roda aqui; não precisa baixar o Electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
